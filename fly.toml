app = "vocal-journaling"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_HOST = "vocal-journaling.fly.dev"
  OPENROUTER_MODEL = "anthropic/claude-sonnet-4"
  OPENROUTER_TIMEOUT = "30"
  OPENROUTER_TRANSCRIPTION_MODEL = "openai/whisper-large-v3-turbo"
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_MAX_THREADS = "5"
  RAILS_SERVE_STATIC_FILES = "true"
  SOLID_QUEUE_IN_PUMA = "true"
  THRUSTER_HTTP_PORT = "8080"
  THRUSTER_TARGET_PORT = "3000"

[[mounts]]
  source = "carnet_data"
  destination = "/rails/storage"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "25s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
